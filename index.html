<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبه وهاب</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #0f172a; color: white; padding: 20px; }
        .container { background: #1e293b; max-width: 500px; margin: auto; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn { display: block; width: 100%; margin: 10px 0; padding: 14px; font-size: 18px; font-weight: bold; border: none; background: #3b82f6; color: white; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #2563eb; }
        .correct { background-color: #22c55e !important; }
        .wrong { background-color: #ef4444 !important; }
        .hidden { display: none; }
        .scoreboard { display: flex; justify-content: space-between; margin-bottom: 20px; background: #334155; padding: 10px 20px; border-radius: 8px; }
        .turn-indicator { color: #f59e0b; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 لعبه وهاب</h1>

    <!-- شاشة اختيار الفئة -->
    <div id="category-screen">
        <h3>اختر فئة الأسئلة لبدء اللعبة:</h3>
        <button class="btn" onclick="selectCategory('kuwait')">🇰🇼 أسئلة عن الكويت</button>
        <button class="btn" onclick="selectCategory('geography')">🌍 أسئلة جغرافيا</button>
        <button class="btn" onclick="selectCategory('games')">🎮 أسئلة ألعاب</button>
    </div>

    <!-- شاشة اللعب -->
    <div id="quiz-screen" class="hidden">
        <div class="scoreboard">
            <div>الفريق الأول: <span id="score1">0</span></div>
            <div>الفريق الثاني: <span id="score2">0</span></div>
        </div>
        <div class="turn-indicator" id="turn-text">دور الفريق الأول</div>
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
    </div>

    <!-- شاشة النتيجة النهائية -->
    <div id="result-screen" class="hidden">
        <h2>🎉 انتهت اللعبة!</h2>
        <h1 id="winner-text"></h1>
        <button class="btn" onclick="resetGame()">اللعب مرة أخرى 🔄</button>
    </div>
</div>

<script>
    const quizData = {
        kuwait: [
            { question: "ما هي عاصمة دولة الكويت؟", options: ["مدينة الكويت", "الجهراء", "حولي"], correct: 0 },
            { question: "ما هو أطول برج في الكويت؟", options: ["أبراج الكويت", "برج الحمراء", "برج التحرير"], correct: 1 },
            { question: "في أي عام استقلت دولة الكويت؟", options: ["1961", "1971", "1950"], correct: 0 },
            { question: "ما هو العملة الرسمية لدولة الكويت؟", options: ["الريال", "الدرهم", "الدينار"], correct: 2 }
        ],
        geography: [
            { question: "ما هو أكبر محيط في العالم؟", options: ["المحيط الأطلسي", "المحيط الهادي", "المحيط الهندي"], correct: 1 },
            { question: "أين تقع أهرامات الجيزة؟", options: ["مصر", "السودان", "الأردن"], correct: 0 },
            { question: "ما هي أكبر قارة في العالم من حيث المساحة؟", options: ["أفريقيا", "آسيا", "أوروبا"], correct: 1 }
        ],
        games: [
            { question: "ما اسم بطل لعبة Super Mario؟", options: ["ماريو", "لويجي", "سونيك"], correct: 0 },
            { question: "أي شركة طورت لعبة Fortnite؟", options: ["Epic Games", "EA", "Ubisoft"], correct: 0 },
            { question: "ما هي اللعبة الأكثر مبيعاً في التاريخ؟", options: ["GTA V", "Minecraft", "Tetris"], correct: 1 }
        ]
    };

    let currentQ = 0;
    let turn = 1;
    let score1 = 0;
    let score2 = 0;
    let questions = [];

    function selectCategory(categoryKey) {
        questions = quizData[categoryKey];
        currentQ = 0;
        turn = 1;
        score1 = 0;
        score2 = 0;
        document.getElementById('score1').innerText = score1;
        document.getElementById('score2').innerText = score2;
        
        document.getElementById('category-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQ >= questions.length) {
            endGame();
            return;
        }

        document.getElementById('turn-text').innerText = `دور: الفريق ${turn === 1 ? 'الأول 🔵' : 'الثاني 🔴'}`;
        const q = questions[currentQ];
        document.getElementById('question-text').innerText = q.question;
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = opt;
            b.onclick = () => checkAnswer(idx, q.correct);
            container.appendChild(b);
        });
    }

    function checkAnswer(idx, correct) {
        const buttons = document.querySelectorAll('#options-container .btn');
        buttons.forEach(b => b.disabled = true);

        if (idx === correct) {
            buttons[idx].classList.add('correct');
            if (turn === 1) score1 += 10; else score2 += 10;
        } else {
            buttons[idx].classList.add('wrong');
            buttons[correct].classList.add('correct');
        }

        document.getElementById('score1').innerText = score1;
        document.getElementById('score2').innerText = score2;

        setTimeout(() => nextTurn(true), 1500);
    }

    function nextTurn(advanceQ) {
        if (advanceQ) currentQ++;
        turn = turn === 1 ? 2 : 1;
        loadQuestion();
    }

    function endGame() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let winText = "";
        if (score1 > score2) winText = "🏆 الفائز هو الفريق الأول!";
        else if (score2 > score1) winText = "🏆 الفائز هو الفريق الثاني!";
        else winText = "🤝 تعادل الفريقان!";

        document.getElementById('winner-text').innerText = winText;
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    function resetGame() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('category-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
